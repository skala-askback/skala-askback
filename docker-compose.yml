# 3개 컨테이너(postgres / backend / frontend)를 하나의 네트워크로 묶어서 기동하는 compose 파일

services:
  # ---------------------------------------------------------------
  # 1) PostgreSQL: 공식 이미지를 그대로 사용 (직접 빌드하지 않음)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16 # LTS 버전 고정
    container_name: askback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: askback # 최초 기동 시 자동 생성될 DB 이름
      POSTGRES_USER: askback # 애플리케이션이 사용할 계정
      POSTGRES_PASSWORD: askback # 위 계정의 비밀번호
    volumes:
      # DB 데이터 파일을 named volume에 저장 → 컨테이너를 지웠다 다시 만들어도 데이터 유지
      - postgres_data:/var/lib/postgresql/data
      # db/ 폴더 안의 *.sql 을 컨테이너의 초기화 디렉터리에 마운트
      # → postgres 공식 이미지는 "데이터 볼륨이 비어있는 최초 기동 시"에만
      #   이 디렉터리 안의 .sql 파일을 알파벳 순서로 자동 실행해줌 (스키마 + 목데이터 세팅)
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # backend가 DB보다 먼저 떠서 연결 실패하는 걸 막기 위해,
      # "DB가 실제로 요청을 받을 준비가 됐는지"를 주기적으로 확인
      test: ["CMD-SHELL", "pg_isready -U askback -d askback"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - askback-net
    # 로컬에서 DB 클라이언트로 직접 접속해서 디버깅하고 싶을 때만 주석 해제
    # ports:
    #   - "5432:5432"

  # ---------------------------------------------------------------
  # 2) Backend: Spring Boot (backend/Dockerfile로 직접 빌드)
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./backend # backend/Dockerfile을 이용해 이미지 빌드
    container_name: askback-backend
    restart: unless-stopped
    environment:
      # application.yml의 ${DB_HOST:localhost} 같은 플레이스홀더를 여기서 덮어씀
      DB_HOST: postgres # compose 네트워크 안에서는 서비스명이 곧 호스트명
      DB_PORT: 5432
      DB_NAME: askback # postgres 서비스의 POSTGRES_DB와 일치해야 함
      DB_USER: askback # postgres 서비스의 POSTGRES_USER와 일치해야 함
      DB_PASSWORD: askback # postgres 서비스의 POSTGRES_PASSWORD와 일치해야 함
    depends_on:
      postgres:
        condition: service_healthy # postgres의 healthcheck가 통과한 뒤에만 backend 기동
    networks:
      - askback-net
    # nginx가 /api를 backend:8080으로 프록시하므로 host에 노출할 필요는 없지만,
    # 백엔드 API를 직접 호출해서 디버깅하고 싶을 때만 주석 해제
    # ports:
    #   - "8081:8080"

  # ---------------------------------------------------------------
  # 3) Frontend: Vue 빌드 결과물을 nginx로 서빙 (frontend/Dockerfile로 직접 빌드)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend # frontend/Dockerfile을 이용해 이미지 빌드
    container_name: askback-frontend
    restart: unless-stopped
    depends_on:
      - backend # backend 컨테이너가 (기동은) 시작된 뒤에 뜨도록
    ports:
      - "8080:80" # host의 8080 → 컨테이너의 80(nginx) → localhost:8080 접속 포인트
    networks:
      - askback-net

# 서비스 간 통신을 위한 전용 네트워크
# (frontend가 nginx.conf에서 http://backend:8080 으로 프록시하려면 같은 네트워크에 있어야 함)
networks:
  askback-net:
    driver: bridge

# PostgreSQL 데이터 영속화용 named volume
# 삭제하고 싶으면(=초기화 스크립트 재실행하고 싶으면) `docker compose down -v`
volumes:
  postgres_data:
